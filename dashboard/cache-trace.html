<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>缓存命中监控</title>
<style>:root{color-scheme:dark;--bg:#07101f;--panel:#101c30;--line:#263750;--muted:#8ea0b9;--good:#47d7a3;--warn:#ffbd66;--bad:#ff7f91;--info:#78a9ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#14294a,var(--bg) 42%);color:#edf5ff;font:14px system-ui,-apple-system,sans-serif}main{max-width:1480px;margin:auto;padding:28px}.head{display:flex;justify-content:space-between;align-items:end;gap:18px}.head>div{min-width:0}.head h1{margin:0;font-size:28px}#root{overflow-wrap:anywhere}.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}.toggle{display:flex;align-items:center;gap:9px;background:#101c30;border:1px solid var(--line);border-radius:10px;padding:8px 11px;cursor:pointer}.toggle input{width:18px;height:18px;accent-color:var(--good)}.toggle.busy{opacity:.65;pointer-events:none}.state{min-width:154px;text-align:right}.state.on{color:var(--good)}.state.off{color:var(--warn)}.muted{color:var(--muted)}button,select{background:#172640;color:#eef6ff;border:1px solid var(--line);border-radius:9px;padding:9px 12px}.cards{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin:22px 0}.card.primary{grid-column:span 2}.card,.panel{background:rgba(16,28,48,.92);border:1px solid var(--line);border-radius:14px;padding:16px}.value{font-size:25px;font-weight:720;margin-top:8px}.layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px}.sessions{max-height:680px;overflow:auto}.session{padding:12px;border-bottom:1px solid var(--line);cursor:pointer}.session:hover,.session.active{background:#1a2b47}.session b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar{height:6px;background:#293951;border-radius:9px;margin-top:8px}.bar i{display:block;height:100%;background:var(--good);border-radius:9px}table{width:100%;min-width:1040px;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);position:sticky;top:0;background:var(--panel)}.records{min-width:0;max-height:680px;overflow:auto}.reset{color:var(--warn)}.good{color:var(--good)}.bad{color:var(--bad)}.reason{display:inline-block;max-width:210px;line-height:1.35;margin-top:3px}.pill{display:inline-flex;padding:3px 7px;border-radius:999px;font-weight:750;white-space:nowrap;background:#22334e;color:var(--muted)}.pill.succeeded{background:rgba(71,215,163,.14);color:var(--good)}.pill.retrying{background:rgba(255,189,102,.14);color:var(--warn)}.pill.failed{background:rgba(255,127,145,.14);color:var(--bad)}.pill.cancelled,.pill.incomplete{background:rgba(120,169,255,.14);color:var(--info)}.error{max-width:150px;line-height:1.45;overflow-wrap:anywhere}@media(max-width:1100px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:900px){main{padding:18px}.head{flex-direction:column;align-items:stretch}.actions{width:100%;justify-content:flex-start}.state{min-width:0;flex-basis:100%;text-align:left}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.layout{grid-template-columns:minmax(0,1fr)}.sessions{max-height:320px}}</style></head>
<body><main><div class="head"><div><h1>缓存命中监控</h1><div class="muted" id="root">正在读取 trace…</div></div><div class="actions"><div id="captureState" class="state muted">正在读取采集状态…</div><label id="captureToggle" class="toggle"><input id="enabled" type="checkbox"><span>采集 Cache Trace</span></label><button id="reload">刷新</button></div></div><section class="cards"><div class="card">Trace 文件<div class="value" id="files">—</div></div><div class="card">Provider Attempts<div class="value" id="records">—</div></div><div class="card">会话<div class="value" id="sessionsCount">—</div></div><div class="card">重试后恢复<div class="value good" id="recovered">—</div></div><div class="card">最终失败<div class="value bad" id="failed">—</div></div><div class="card">未完成<div class="value" id="incomplete">—</div></div><div class="card primary">当前会话主验收命中率<div class="value" id="ratio">—</div></div><div class="card">主验收可用 Attempts<div class="value good" id="eligible">—</div></div><div class="card">主验收不合格 Attempts<div class="value bad" id="ineligible">—</div></div></section><section class="layout"><div class="panel sessions" id="sessions"></div><div class="panel records"><table><thead><tr><th>时间 / 轮次 / Attempt</th><th>终态</th><th>请求类型 / 所属</th><th>模型与 API</th><th>缓存策略</th><th>输入</th><th>读 / 写缓存</th><th>真实命中率 / 验收资格</th><th>前缀变化</th><th>失败摘要</th></tr></thead><tbody id="rows"></tbody></table></div></section></main>
<script>
const $=id=>document.getElementById(id), pct=n=>`${(Number(n)*100).toFixed(1)}%`, num=n=>Number(n||0).toLocaleString(), hasNumber=n=>typeof n==='number'&&Number.isFinite(n);let sessions=[];const outcomeText={succeeded:'成功',retrying:'准备重试',failed:'最终失败',cancelled:'已取消',incomplete:'未完成'};const requestKindText={main_inference:'主推理',checkpoint_compaction:'Checkpoint 压缩',memory_branch_inference:'Memory Branch 推理',subagent_inference:'Subagent 推理',unknown:'未知'};const requestOriginText={main:'主会话',memory_branch:'Memory Branch',subagent:'Subagent',unknown:'未知'};const cacheStrategyText={'anthropic-cache-bypassed':'Anthropic 单次调用不缓存','anthropic-explicit-prefix':'Anthropic 显式前缀','anthropic-explicit-stable-prefix':'Anthropic 分层显式断点','anthropic-compatible-no-markers':'Anthropic 兼容端无标记','openai-cache-bypassed':'OpenAI 单次调用不缓存','openai-explicit-stable-prefix':'OpenAI 显式稳定前缀','openai-prompt-cache-key':'OpenAI 路由 Key + 自动','openai-compatible-automatic-prefix':'兼容端自动前缀','openai-automatic-prefix':'OpenAI 自动前缀',unknown:'未知'};const qualificationReasonText={'legacy-trace-schema':'旧版 Trace schema','request-kind-not-reported':'请求类型未上报','request-kind-invalid':'请求类型无效','request-origin-not-reported':'请求所属未上报','request-origin-invalid':'请求所属无效','attempt-not-succeeded':'Attempt 未成功','response-usage-missing':'Provider usage 未上报','input-tokens-not-reported':'输入 token 未上报','cache-read-not-reported':'缓存读取未上报','cache-read-source-not-reported':'缓存读取来源未上报','cache-read-source-invalid':'缓存读取来源无效','cache-write-not-reported':'Anthropic 缓存写入未上报，归一分母不完整','invalid-input-tokens':'输入 token 无效','invalid-cache-read-tokens':'缓存读取 token 无效','cache-read-exceeds-input':'缓存读取超过输入','invalid-cache-write-tokens':'缓存写入 token 无效','cache-write-exceeds-input':'缓存写入超过输入'};
async function json(url,init={}){const storageKey='catsco.dashboardApiKey';let key='';try{key=sessionStorage.getItem(storageKey)||''}catch{};const request=()=>fetch(url,{...init,headers:{...(init.headers||{}),...(key?{'X-API-Key':key}:{})}});let r=await request();if(r.status===401||r.status===403){const entered=window.prompt('Dashboard API Key 无效或缺失，请输入')||'';key=entered.trim();if(key){try{sessionStorage.setItem(storageKey,key)}catch{};r=await request()}}if(!r.ok)throw new Error(`${r.status} ${await r.text()}`);return r.json()}
function renderCaptureState(enabled,message){$('enabled').checked=enabled;$('captureState').className=`state ${enabled?'on':'off'}`;$('captureState').textContent=message||`${enabled?'采集已开启':'采集已关闭'} · 看板始终可用`}
async function load(){try{const [config,status,list]=await Promise.all([json('/api/cache-trace/config'),json('/api/cache-trace/status'),json('/api/cache-trace/sessions')]);renderCaptureState(config.enabled);$('root').textContent=`${status.traceDir} · 坏文件 ${num(status.malformedFiles)}`;$('files').textContent=num(status.scannedFiles);$('records').textContent=num(status.records);$('sessionsCount').textContent=num(status.sessions);sessions=list.sessions||[];$('recovered').textContent=num(sessions.reduce((n,s)=>n+(s.recoveredCalls||0),0));$('failed').textContent=num(sessions.reduce((n,s)=>n+(s.terminalFailedCalls||0),0));$('incomplete').textContent=num(sessions.reduce((n,s)=>n+(s.incompleteAttempts||0),0));renderSessions();if(sessions[0])await select(sessions[0].sessionId)}catch(e){$('root').textContent=`读取失败：${e.message}`}}
function renderSessions(){$('sessions').innerHTML=sessions.map(s=>{const eligible=Number(s.primaryEligibleAttempts??s.primaryAccountingAttempts??s.eligibleAttempts??0),ineligible=Number(s.primaryIneligibleAttempts??s.ineligibleAttempts??0),auxEligible=Number(s.auxiliaryEligibleAttempts||0),auxIneligible=Number(s.auxiliaryIneligibleAttempts||0),qualifiedRatio=hasNumber(s.weightedHitRatio)?pct(s.weightedHitRatio):'无主验收证据',ratio=ineligible>0?`主验收不可用 · 合格子集 ${qualifiedRatio}`:qualifiedRatio,bar=ineligible===0&&hasNumber(s.weightedHitRatio)?`<div class="bar" aria-label="主验收真实缓存命中率 ${qualifiedRatio}"><i style="width:${Math.min(100,s.weightedHitRatio*100)}%"></i></div>`:'';return `<div class="session" data-id="${escapeHtml(s.sessionId)}"><b>${escapeHtml(s.sessionId)}</b><span class="muted">${s.records} attempts · ${s.calls} calls · 恢复 ${s.recoveredCalls}</span><br><span class="muted">主验收可用 ${eligible} · 不合格 ${ineligible}<br>${ratio}</span><br><span class="muted">辅助诊断可用 ${auxEligible} · 不可观测 ${auxIneligible}（不计主验收）</span><br><span class="muted">${escapeHtml(s.models.join(', '))}</span>${bar}</div>`}).join('');document.querySelectorAll('.session').forEach(el=>el.onclick=()=>select(el.dataset.id))}
async function select(id){document.querySelectorAll('.session').forEach(el=>el.classList.toggle('active',el.dataset.id===id));const data=await json('/api/cache-trace/session/'+encodeURIComponent(id));const primaryEligible=Number(data.session.primaryEligibleAttempts??data.session.primaryAccountingAttempts??data.session.eligibleAttempts??0),primaryIneligible=Number(data.session.primaryIneligibleAttempts??data.session.ineligibleAttempts??0),sessionRatio=hasNumber(data.session.weightedHitRatio)?pct(data.session.weightedHitRatio):'无主验收证据';$('ratio').textContent=primaryIneligible>0?`主验收不可用 · 合格子集 ${sessionRatio}`:sessionRatio;$('eligible').textContent=num(primaryEligible);$('ineligible').textContent=num(primaryIneligible);$('rows').innerHTML=data.records.slice().reverse().map(r=>{const usage=r.usage||{},qualification=r.qualification||{eligible:false,reasons:['legacy-trace-schema']},primary=r.requestOrigin==='main'&&(r.requestKind==='main_inference'||r.requestKind==='checkpoint_compaction');const input=usage.responseUsagePresent?(hasNumber(usage.inputTokens)?num(usage.inputTokens):'<span class="bad">无效</span>'):`<span class="muted">未上报 · 估算 ~${num(r.estimatedTokens)}</span>`;const read=usage.cacheReadReported?(hasNumber(usage.cacheReadTokens)?num(usage.cacheReadTokens):'<span class="bad">无效</span>'):'<span class="muted">未上报</span>';const write=usage.cacheWriteReported?(hasNumber(usage.cacheWriteTokens)?num(usage.cacheWriteTokens):'<span class="bad">无效</span>'):'<span class="muted">未上报</span>';const reasonText=(qualification.reasons||[]).map(reason=>qualificationReasonText[reason]||reason).join(' · ')||'未知原因';const ratioText=qualification.eligible&&hasNumber(usage.hitRatio)?`<span class="good">${pct(usage.hitRatio)}</span><br><span class="muted">${primary?'计入主验收':'辅助诊断，不计主验收'}</span>`:primary?`<span class="bad">主验收不可用</span>${hasNumber(usage.hitRatio)?`<br><span class="muted">诊断 ${pct(usage.hitRatio)}</span>`:''}<br><span class="muted reason">原因：${escapeHtml(reasonText)}</span>`:`<span class="muted">辅助诊断不可观测</span><br><span class="muted">不计主验收</span><br><span class="muted reason">原因：${escapeHtml(reasonText)}</span>`;const prefix=r.diff.baselineReset?'基线重置':r.diff.stableSystemChanged?'稳定系统提示变化':r.diff.changedMessageIndices.length?`消息变化 ${r.diff.changedMessageIndices.join(',')}`:'稳定';const failure=r.errorSummary?`${r.httpStatus?`HTTP ${r.httpStatus} · `:''}${r.errorSummary}`:'';const plan=r.cachePlan;const lifecycle=r.contextLifecycle;const strategy=cacheStrategyText[r.cacheStrategy]||r.cacheStrategy||'未知';const planDetail=plan?`稳定前缀 ~${num(plan.stablePrefixEstimatedTokens)} · 断点 ${num(plan.explicitBreakpoints)}`:'无计划详情';const lifecycleDetail=lifecycle?`上下文 S/E/C ${num(lifecycle.lifecycleCounts.session)}/${num(lifecycle.lifecycleCounts.episode)}/${num(lifecycle.lifecycleCounts.call)} · epoch ${lifecycle.epochFingerprint||'—'}`:'';const strategyDetail=[planDetail,lifecycleDetail].filter(Boolean).join('<br>');const strategyTitle=[planDetail,lifecycleDetail,plan?.promptCacheKeyFingerprint?`Key ${plan.promptCacheKeyFingerprint}`:''].filter(Boolean).join(' · ');const kind=requestKindText[r.requestKind]||r.requestKind||'未知',origin=requestOriginText[r.requestOrigin]||r.requestOrigin||'未知';return `<tr><td>${new Date(r.timestamp).toLocaleString()}<br><span class="muted">E${r.episodeNumber} · A${r.attemptNumber}<br>${escapeHtml(String(r.callId).slice(0,12))}</span></td><td><span class="pill ${escapeHtml(r.outcome)}">${escapeHtml(outcomeText[r.outcome]||r.outcome)}</span>${r.retryDelayMs?`<br><span class="muted">${num(r.retryDelayMs)}ms 后重试</span>`:''}</td><td>${escapeHtml(kind)}<br><span class="muted">${escapeHtml(origin)} · ${primary?'主验收':'辅助诊断'}</span></td><td>${escapeHtml(r.provider)} / ${escapeHtml(r.model)}<br><span class="muted">${escapeHtml(r.apiType)}</span></td><td title="${escapeHtml(strategyTitle)}">${escapeHtml(strategy)}<br><span class="muted">${strategyDetail.split('<br>').map(escapeHtml).join('<br>')}</span></td><td>${input}</td><td><span class="good">${read}</span> / ${write}</td><td>${ratioText}</td><td class="${r.diff.baselineReset?'reset':''}">${prefix}</td><td class="error bad" title="${escapeHtml(failure)}">${escapeHtml(failure||'—')}</td></tr>`}).join('')}
async function setCaptureEnabled(enabled){const toggle=$('captureToggle');toggle.classList.add('busy');$('enabled').disabled=true;try{const result=await json('/api/cache-trace/config',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled})});const suffix=result.connectorRestarted?'，CatsCo Agent 正在重启':result.appliesOnNextStart?'，下次启动 Agent 时生效':'';renderCaptureState(result.enabled,`${result.enabled?'采集已开启':'采集已关闭'}${suffix}`)}catch(e){renderCaptureState(!enabled,`保存失败：${e.message}`)}finally{toggle.classList.remove('busy');$('enabled').disabled=false}}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}$('reload').onclick=load;$('enabled').onchange=e=>setCaptureEnabled(e.target.checked);load();
</script></body></html>
