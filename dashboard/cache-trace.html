<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>缓存命中监控</title>
<style>:root{color-scheme:dark;--bg:#07101f;--panel:#101c30;--line:#263750;--muted:#8ea0b9;--good:#47d7a3;--warn:#ffbd66;--bad:#ff7f91;--info:#78a9ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#14294a,var(--bg) 42%);color:#edf5ff;font:14px system-ui,-apple-system,sans-serif}main{max-width:1480px;margin:auto;padding:28px}.head{display:flex;justify-content:space-between;align-items:end;gap:18px}.head>div{min-width:0}.head h1{margin:0;font-size:28px}#root{overflow-wrap:anywhere}.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}.toggle{display:flex;align-items:center;gap:9px;background:#101c30;border:1px solid var(--line);border-radius:10px;padding:8px 11px;cursor:pointer}.toggle input{width:18px;height:18px;accent-color:var(--good)}.toggle.busy{opacity:.65;pointer-events:none}.state{min-width:154px;text-align:right}.state.on{color:var(--good)}.state.off{color:var(--warn)}.muted{color:var(--muted)}button,select{background:#172640;color:#eef6ff;border:1px solid var(--line);border-radius:9px;padding:9px 12px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px;margin:22px 0}.card,.panel{background:rgba(16,28,48,.92);border:1px solid var(--line);border-radius:14px;padding:16px}.value{font-size:25px;font-weight:720;margin-top:8px}.layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px}.sessions{max-height:680px;overflow:auto}.session{padding:12px;border-bottom:1px solid var(--line);cursor:pointer}.session:hover,.session.active{background:#1a2b47}.session b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar{height:6px;background:#293951;border-radius:9px;margin-top:8px}.bar i{display:block;height:100%;background:var(--good);border-radius:9px}table{width:100%;min-width:820px;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);position:sticky;top:0;background:var(--panel)}.records{min-width:0;max-height:680px;overflow:auto}.reset{color:var(--warn)}.good{color:var(--good)}.bad{color:var(--bad)}.pill{display:inline-flex;padding:3px 7px;border-radius:999px;font-weight:750;white-space:nowrap;background:#22334e;color:var(--muted)}.pill.succeeded{background:rgba(71,215,163,.14);color:var(--good)}.pill.retrying{background:rgba(255,189,102,.14);color:var(--warn)}.pill.failed{background:rgba(255,127,145,.14);color:var(--bad)}.pill.cancelled,.pill.incomplete{background:rgba(120,169,255,.14);color:var(--info)}.error{max-width:220px;line-height:1.45;overflow-wrap:anywhere}@media(max-width:900px){main{padding:18px}.head{flex-direction:column;align-items:stretch}.actions{width:100%;justify-content:flex-start}.state{min-width:0;flex-basis:100%;text-align:left}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.layout{grid-template-columns:minmax(0,1fr)}.sessions{max-height:320px}}</style></head>
<body><main><div class="head"><div><h1>缓存命中监控</h1><div class="muted" id="root">正在读取 trace…</div></div><div class="actions"><div id="captureState" class="state muted">正在读取采集状态…</div><label id="captureToggle" class="toggle"><input id="enabled" type="checkbox"><span>采集 Cache Trace</span></label><button id="reload">刷新</button></div></div><section class="cards"><div class="card">Trace 文件<div class="value" id="files">—</div></div><div class="card">Provider Attempts<div class="value" id="records">—</div></div><div class="card">会话<div class="value" id="sessionsCount">—</div></div><div class="card">重试后恢复<div class="value good" id="recovered">—</div></div><div class="card">最终失败<div class="value bad" id="failed">—</div></div><div class="card">未完成<div class="value" id="incomplete">—</div></div><div class="card">当前会话命中率<div class="value" id="ratio">—</div></div></section><section class="layout"><div class="panel sessions" id="sessions"></div><div class="panel records"><table><thead><tr><th>时间 / 轮次 / Attempt</th><th>终态</th><th>模型与 API</th><th>输入</th><th>读 / 写缓存</th><th>命中率</th><th>前缀变化</th><th>失败摘要</th></tr></thead><tbody id="rows"></tbody></table></div></section></main>
<script>
const $=id=>document.getElementById(id), pct=n=>`${((n||0)*100).toFixed(1)}%`, num=n=>Number(n||0).toLocaleString(); let sessions=[];const outcomeText={succeeded:'成功',retrying:'准备重试',failed:'最终失败',cancelled:'已取消',incomplete:'未完成'};
async function json(url,init={}){const storageKey='catsco.dashboardApiKey';let key='';try{key=sessionStorage.getItem(storageKey)||''}catch{};const request=()=>fetch(url,{...init,headers:{...(init.headers||{}),...(key?{'X-API-Key':key}:{})}});let r=await request();if(r.status===401||r.status===403){const entered=window.prompt('Dashboard API Key 无效或缺失，请输入')||'';key=entered.trim();if(key){try{sessionStorage.setItem(storageKey,key)}catch{};r=await request()}}if(!r.ok)throw new Error(`${r.status} ${await r.text()}`);return r.json()}
function renderCaptureState(enabled,message){$('enabled').checked=enabled;$('captureState').className=`state ${enabled?'on':'off'}`;$('captureState').textContent=message||`${enabled?'采集已开启':'采集已关闭'} · 看板始终可用`}
async function load(){try{const [config,status,list]=await Promise.all([json('/api/cache-trace/config'),json('/api/cache-trace/status'),json('/api/cache-trace/sessions')]);renderCaptureState(config.enabled);$('root').textContent=`${status.traceDir} · 坏文件 ${num(status.malformedFiles)}`;$('files').textContent=num(status.scannedFiles);$('records').textContent=num(status.records);$('sessionsCount').textContent=num(status.sessions);sessions=list.sessions||[];$('recovered').textContent=num(sessions.reduce((n,s)=>n+(s.recoveredCalls||0),0));$('failed').textContent=num(sessions.reduce((n,s)=>n+(s.terminalFailedCalls||0),0));$('incomplete').textContent=num(sessions.reduce((n,s)=>n+(s.incompleteAttempts||0),0));renderSessions();if(sessions[0])await select(sessions[0].sessionId)}catch(e){$('root').textContent=`读取失败：${e.message}`}}
function renderSessions(){ $('sessions').innerHTML=sessions.map(s=>`<div class="session" data-id="${escapeHtml(s.sessionId)}"><b>${escapeHtml(s.sessionId)}</b><span class="muted">${s.records} attempts · ${s.calls} calls · 恢复 ${s.recoveredCalls}</span><br><span class="muted">${escapeHtml(s.models.join(', '))}</span><div class="bar"><i style="width:${Math.min(100,s.weightedHitRatio*100)}%"></i></div></div>`).join('');document.querySelectorAll('.session').forEach(el=>el.onclick=()=>select(el.dataset.id))}
async function select(id){document.querySelectorAll('.session').forEach(el=>el.classList.toggle('active',el.dataset.id===id));const data=await json('/api/cache-trace/session/'+encodeURIComponent(id));$('ratio').textContent=pct(data.session.weightedHitRatio);$('rows').innerHTML=data.records.slice().reverse().map(r=>{const input=r.usage.inputTokens?num(r.usage.inputTokens):`~${num(r.estimatedTokens)}`;const prefix=r.diff.baselineReset?'基线重置':r.diff.stableSystemChanged?'稳定系统提示变化':r.diff.changedMessageIndices.length?`消息变化 ${r.diff.changedMessageIndices.join(',')}`:'稳定';const failure=r.errorSummary?`${r.httpStatus?`HTTP ${r.httpStatus} · `:''}${r.errorSummary}`:'';return `<tr><td>${new Date(r.timestamp).toLocaleString()}<br><span class="muted">E${r.episodeNumber} · A${r.attemptNumber}<br>${escapeHtml(String(r.callId).slice(0,12))}</span></td><td><span class="pill ${escapeHtml(r.outcome)}">${escapeHtml(outcomeText[r.outcome]||r.outcome)}</span>${r.retryDelayMs?`<br><span class="muted">${num(r.retryDelayMs)}ms 后重试</span>`:''}</td><td>${escapeHtml(r.provider)} / ${escapeHtml(r.model)}<br><span class="muted">${escapeHtml(r.apiType)}</span></td><td>${input}</td><td><span class="good">${num(r.usage.cacheReadTokens)}</span> / ${num(r.usage.cacheWriteTokens)}</td><td>${pct(r.usage.hitRatio)}</td><td class="${r.diff.baselineReset?'reset':''}">${prefix}</td><td class="error bad" title="${escapeHtml(failure)}">${escapeHtml(failure||'—')}</td></tr>`}).join('')}
async function setCaptureEnabled(enabled){const toggle=$('captureToggle');toggle.classList.add('busy');$('enabled').disabled=true;try{const result=await json('/api/cache-trace/config',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled})});const suffix=result.connectorRestarted?'，CatsCo Agent 正在重启':result.appliesOnNextStart?'，下次启动 Agent 时生效':'';renderCaptureState(result.enabled,`${result.enabled?'采集已开启':'采集已关闭'}${suffix}`)}catch(e){renderCaptureState(!enabled,`保存失败：${e.message}`)}finally{toggle.classList.remove('busy');$('enabled').disabled=false}}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}$('reload').onclick=load;$('enabled').onchange=e=>setCaptureEnabled(e.target.checked);load();
</script></body></html>
