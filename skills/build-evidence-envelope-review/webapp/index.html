<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finding Pool</title><style>
:root{--ink:#18241e;--muted:#617068;--paper:#f3f6f3;--card:#fff;--line:#d9e3dc;--green:#176b47;--green-soft:#e7f4eb;--amber:#9b6107;--amber-soft:#fff1d7;--red:#aa4035;--red-soft:#fdebe8;--blue:#2b637e;--shadow:0 10px 30px rgba(26,52,38,.08)}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,"Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif}.app{max-width:1480px;margin:auto;padding:30px 34px 60px}.top{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:22px}.eyebrow{font-size:11px;color:var(--green);font-weight:850;letter-spacing:.1em}.top h1{margin:6px 0 5px;font-size:31px;line-height:1.15}.top p{margin:0;color:var(--muted);font-size:14px}.refresh{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 13px;font:inherit;font-weight:750;cursor:pointer}.approval-panel{margin-bottom:18px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px 18px;box-shadow:var(--shadow)}.approval-panel h2{font-size:16px;margin:0 0 6px}.approval-panel p{font-size:12px;line-height:1.55;color:var(--muted);margin:0 0 10px}.approval-list{display:flex;gap:9px;flex-wrap:wrap}.approval{border:1px solid #ead49b;background:var(--amber-soft);border-radius:10px;padding:9px 11px;min-width:205px}.approval b{display:block;font-size:12px}.approval span{font-size:11px;color:#76520f}.metrics{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:10px;margin-bottom:18px}.metric{background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px 15px;box-shadow:var(--shadow)}.metric b{font-size:24px;display:block}.metric span{font-size:11px;color:var(--muted)}.pool{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}.toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}.toolbar h2{font-size:16px;margin:0}.toolbar input{border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:inherit;min-width:270px}.finding-list{display:grid}.finding{display:grid;grid-template-columns:120px minmax(220px,1.6fr) minmax(210px,1.25fr) 120px 112px 34px;gap:16px;align-items:center;padding:15px 18px;border:0;border-bottom:1px solid #edf1ee;background:#fff;text-align:left;width:100%;cursor:pointer;font:inherit;color:inherit}.finding:hover,.finding.active{background:#f2f8f3}.finding.active{box-shadow:inset 4px 0 var(--green)}.fid{font-weight:850;font-size:13px}.title{font-size:14px;font-weight:800;line-height:1.35}.obs{font-size:12px;color:var(--muted);line-height:1.45;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.evidence-summary{font-size:12px;line-height:1.5;color:#31483b}.evidence-summary b{color:var(--ink)}.meta{font-size:11px;color:var(--muted);line-height:1.55}.chev{font-size:20px;color:#8a9b90}.tag{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:850;letter-spacing:.02em;width:max-content}.tag.incomplete{background:var(--amber-soft);color:var(--amber)}.tag.issue{background:var(--red-soft);color:var(--red)}.tag.close{background:var(--green-soft);color:var(--green)}.tag.priority{background:#e8f0ec;color:#355442}.detail{display:none;margin-top:20px;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}.detail.open{display:block}.detail-head{padding:21px 22px 17px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;align-items:start}.detail h2{font-size:21px;margin:5px 0 0}.close-detail{background:transparent;border:0;font-size:23px;cursor:pointer;color:var(--muted)}.detail-body{padding:20px 22px 24px}.overview{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.panel{border:1px solid var(--line);border-radius:15px;padding:16px}.panel h3{font-size:13px;margin:0 0 9px}.problem{font-size:14px;line-height:1.6;margin:0}.impact{font-size:12px;line-height:1.5;color:var(--muted);margin:9px 0 0}.state{background:#f5f8f5}.state .big{font-size:18px;font-weight:850;margin:7px 0}.state p{font-size:12px;line-height:1.5;color:var(--muted);margin:0}.evidence-head{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 9px}.evidence-head h3{margin:0;font-size:15px}.evidence-head span{font-size:11px;color:var(--muted)}.evidence-list{border:1px solid var(--line);border-radius:15px;overflow:hidden}.evidence{padding:13px 15px;border-bottom:1px solid #edf1ee;display:grid;grid-template-columns:76px 1fr 118px;gap:12px;align-items:start}.evidence:last-child{border:0}.evidence-id{font-size:11px;font-weight:850;color:var(--blue)}.evidence-title{font-size:13px;font-weight:750;line-height:1.4}.evidence-desc{font-size:11px;color:var(--muted);line-height:1.45;margin-top:4px}.evidence-date{font-size:11px;color:var(--muted);text-align:right}.latest{font-size:12px;color:var(--muted);line-height:1.55;margin-top:15px}.operations{margin-top:18px;border-top:1px solid var(--line);padding-top:15px}.operations summary{cursor:pointer;font-size:12px;font-weight:800;color:var(--muted)}.oprow{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;font:inherit;font-weight:750;cursor:pointer}.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.dialog-wrap{position:fixed;inset:0;display:none;place-items:center;background:rgba(16,31,23,.36);padding:20px;z-index:5}.dialog-wrap.open{display:grid}.dialog{background:#fff;border-radius:18px;padding:22px;width:min(510px,100%);box-shadow:0 24px 70px rgba(0,0,0,.22)}.dialog h3{margin:0 0 15px}.field{margin:12px 0}.field label{display:block;font-size:11px;font-weight:800;color:var(--muted);margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font:inherit}.field textarea{min-height:74px}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:15px}.toast{position:fixed;right:24px;bottom:24px;display:none;background:#87372f;color:#fff;padding:12px 15px;border-radius:10px;box-shadow:var(--shadow)}.toast.open{display:block}.empty{padding:44px;color:var(--muted);text-align:center}.footnote{font-size:11px;color:var(--muted);margin:15px 2px 0;line-height:1.5}@media(max-width:920px){.app{padding:22px 16px}.top{display:block}.refresh{margin-top:14px}.metrics{grid-template-columns:repeat(2,1fr)}.finding{grid-template-columns:100px 1fr 25px}.finding .evidence-summary,.finding .meta{display:none}.overview{grid-template-columns:1fr}.toolbar{display:block}.toolbar input{margin-top:10px;width:100%;min-width:0}}@media(max-width:540px){.finding{grid-template-columns:1fr 24px}.finding .fid{grid-row:1}.finding .title{grid-row:2}.finding .chev{grid-column:2;grid-row:1 / span 2}.top h1{font-size:26px}.evidence{grid-template-columns:64px 1fr}.evidence-date{grid-column:2;text-align:left}}
</style></head><body><main class="app"><header class="top"><div><div class="eyebrow">EVIDENCE ENVELOPE REVIEW</div><h1>Finding Pool</h1><p>从数据库浏览问题与证据摘要；完整来源、哈希和裁决仍以 Envelope JSON 为准。</p></div><button class="refresh" onclick="load()">刷新数据</button></header><section class="approval-panel" id="approvals"><h2>待审批专项</h2><p>这里只显示待批准的受控摘要。请在对应 Review Session 用自然语言批准或拒绝；此页没有审批按钮。</p><div class="approval-list"><span class="empty">正在读取待审批项…</span></div></section><section class="metrics" id="metrics"></section><section class="pool"><div class="toolbar"><h2>全部 Findings</h2><input id="search" oninput="renderPool()" placeholder="搜索 ID、问题或证据标题"></div><div id="findings" class="finding-list"><div class="empty">正在读取 Finding Pool…</div></div></section><section class="detail" id="detail"></section><p class="footnote" id="footnote">这个页面用于 Pool 浏览与受控运营，不替代 Evidence Envelope。带写接口的本地服务默认只绑定 127.0.0.1。</p></main><div id="drawer" class="dialog-wrap"><form class="dialog" id="form"><h3 id="dialogTitle"></h3><div id="dialogBody"></div><div class="actions"><button class="btn" type="button" onclick="closeDialog()">取消</button><button class="btn primary">确认</button></div></form></div><div id="toast" class="toast"></div><script>
let approvals={approvals:[]};const stageName={INTAKE:'收录',MAPPING:'假设地图',COLLECTING:'补充证据',CHALLENGING:'反向审查',JUDGING:'完备判断',TERMINAL:'最终裁决'};let board={findings:[],counts:{}};let selected=null;let submitAction=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(path,opt){const r=await fetch(path,{headers:{'Content-Type':'application/json'},...opt});const d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d}function toast(s){const e=document.getElementById('toast');e.textContent=s;e.classList.add('open');setTimeout(()=>e.classList.remove('open'),3500)}function stateLabel(s){return s==='COMPLETE_ISSUE'?'建议 Issue':s==='COMPLETE_CLOSE'?'建议 Close':'证据待补齐'}function stateClass(s){return s==='COMPLETE_ISSUE'?'issue':s==='COMPLETE_CLOSE'?'close':'incomplete'}function renderApprovals(){const rows=Array.isArray(approvals.approvals)?approvals.approvals:[];document.getElementById('approvals').querySelector('.approval-list').innerHTML=rows.length?rows.map(a=>`<div class="approval"><b>${esc(a.finding_id)} · ${esc(a.task_id)}</b><span>风险：${esc(a.risk)} · 待自然语言审批</span></div>`).join(''):'<span class="empty">当前没有待审批专项。</span>'}function renderMetrics(){const c=board.counts;document.getElementById('metrics').innerHTML=`<div class="metric"><b>${c.total||0}</b><span>全部 Findings</span></div><div class="metric"><b>${c.active||0}</b><span>尚未终结</span></div><div class="metric"><b>${c.issue||0}</b><span>建议 Issue</span></div><div class="metric"><b>${c.close||0}</b><span>建议 Close</span></div>`}function match(f,q){return !q||[f.finding_id,f.title,f.observation,...(f.evidence||[]).map(e=>e.title)].join(' ').toLowerCase().includes(q)}function renderPool(){renderMetrics();const q=document.getElementById('search').value.trim().toLowerCase();const fs=board.findings.filter(f=>match(f,q));document.getElementById('findings').innerHTML=fs.length?fs.map(f=>`<button class="finding ${selected===f.finding_id?'active':''}" onclick="selectFinding('${esc(f.finding_id)}')"><div class="fid">${esc(f.finding_id)}<div><span class="tag priority">${esc(f.priority)}</span></div></div><div><div class="title">${esc(f.title)}</div><div class="obs">${esc(f.observation||'尚未写入问题描述')}</div></div><div class="evidence-summary"><b>${f.evidence_count||0} 条证据</b> · ${f.failed_gate_count||0} 个关键缺口<br>${(f.evidence||[]).slice(0,2).map(e=>esc(e.title)).join('；')||'尚无证据摘要'}</div><div class="meta"><span class="tag ${stateClass(f.review_state)}">${stateLabel(f.review_state)}</span><br>${esc(f.owner)}<br>${f.latest_event?.created_at?new Date(f.latest_event.created_at).toLocaleDateString():''}</div><div class="chev">›</div></button>`).join(''):'<div class="empty">没有匹配的 Finding。</div>'}async function selectFinding(id){selected=id;renderPool();const f=board.findings.find(x=>x.finding_id===id);if(!f)return;let d;try{d=await api('/api/findings/'+encodeURIComponent(id))}catch(e){toast(e.message);return}const ev=f.evidence||[];const latest=f.latest_event||{};document.getElementById('detail').classList.add('open');document.getElementById('detail').innerHTML=`<div class="detail-head"><div><div class="eyebrow">${esc(f.finding_id)} · ${esc(f.priority)} · ${esc(f.owner)}</div><h2>${esc(f.title)}</h2></div><button class="close-detail" onclick="closeDetail()">×</button></div><div class="detail-body"><div class="overview"><section class="panel"><h3>这是什么问题</h3><p class="problem">${esc(f.observation||d.finding?.actualBehavior||'尚未写入问题描述')}</p>${f.impact||d.finding?.impact?`<p class="impact">影响：${esc(f.impact||d.finding?.impact)}</p>`:''}</section><section class="panel state"><h3>当前可裁决性</h3><span class="tag ${stateClass(f.review_state)}">${stateLabel(f.review_state)}</span><div class="big">${f.evidence_count||0} 条证据 · ${f.failed_gate_count||0} 个缺口</div><p>${f.review_state==='INCOMPLETE'?'当前还不能唯一建议 Issue 或 Close。':'Evidence Envelope 已满足终结条件。'}</p></section></div><div class="evidence-head"><h3>证据摘要</h3><span>Pool 快照 · 完整事实在 evidence-index.json</span></div><div class="evidence-list">${ev.length?ev.map(e=>`<div class="evidence"><div class="evidence-id">${esc(e.evidence_id)}<br><span class="tag priority">${esc(e.evidence_type)}</span></div><div><div class="evidence-title">${esc(e.title)}</div><div class="evidence-desc">${esc(e.acquisition_method||'未记录采集方式')}${e.limitations_json?` · 限制：${esc((()=>{try{return JSON.parse(e.limitations_json).join('；')}catch{return ''}})())}`:''}</div></div><div class="evidence-date">${esc(e.collected_at||'日期未记录')}</div></div>`).join(''):'<div class="empty">尚无证据摘要。</div>'}</div><div class="latest">最近记录：${esc(latest.event_type||'暂无')} · ${esc(latest.actor||'')} ${esc(latest.note||'')}</div>${board.read_only?'':`<details class="operations"><summary>受控运营操作</summary><div class="oprow"><button class="btn" onclick="syncEnvelope()">同步 Envelope</button><button class="btn" onclick="openEdit()">责任与行动</button>${f.stage!=='TERMINAL'?`<button class="btn primary" onclick="openTransition()">推进阶段</button>`:''}</div></details>`}</div>`}function closeDetail(){selected=null;document.getElementById('detail').classList.remove('open');renderPool()}function openDialog(title,body,action){document.getElementById('dialogTitle').textContent=title;document.getElementById('dialogBody').innerHTML=body;submitAction=action;document.getElementById('drawer').classList.add('open')}function closeDialog(){document.getElementById('drawer').classList.remove('open');submitAction=null}document.getElementById('form').onsubmit=async e=>{e.preventDefault();if(submitAction)await submitAction(new FormData(e.target));closeDialog()};async function syncEnvelope(){try{await api(`/api/findings/${encodeURIComponent(selected)}/sync`,{method:'POST',body:JSON.stringify({actor:'human'})});await load()}catch(e){toast(e.message)}}function openEdit(){const f=board.findings.find(x=>x.finding_id===selected);openDialog('更新责任与行动',`<div class="field"><label>负责人</label><input name="owner" value="${esc(f.owner)}"></div><div class="field"><label>优先级</label><select name="priority">${['P0','P1','P2','P3'].map(x=>`<option ${x===f.priority?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>下一条证据</label><textarea name="next_action">${esc(f.next_action)}</textarea></div><div class="field"><label>停止条件</label><textarea name="stop_condition">${esc(f.stop_condition)}</textarea></div>`,async fd=>{try{await api(`/api/findings/${encodeURIComponent(selected)}/update`,{method:'POST',body:JSON.stringify({...Object.fromEntries(fd),actor:'human'})});await load()}catch(e){toast(e.message)}})}function openTransition(){const f=board.findings.find(x=>x.finding_id===selected);const next={INTAKE:'MAPPING',MAPPING:'COLLECTING',COLLECTING:'CHALLENGING',CHALLENGING:'JUDGING',JUDGING:'TERMINAL'}[f.stage];if(!next){toast('当前没有可推进的下一阶段');return}openDialog(`推进到“${stageName[next]}”`,`<div class="field"><label>执行人</label><input name="actor" value="human" required></div><div class="field"><label>原因</label><textarea name="note" required></textarea></div>`,async fd=>{try{await api(`/api/findings/${encodeURIComponent(selected)}/transition`,{method:'POST',body:JSON.stringify({to:next,...Object.fromEntries(fd)})});await load()}catch(e){toast(e.message)}})}async function load(){try{const [nextBoard,nextApprovals]=await Promise.all([api('/api/dashboard'),api('/api/review/approvals')]);board=nextBoard;approvals=nextApprovals;renderApprovals();document.getElementById('footnote').textContent=board.read_only?'当前是局域网只读部署：可浏览 Finding Pool 与证据摘要，所有写操作已禁用。':'这个页面用于 Pool 浏览与受控运营，不替代 Evidence Envelope。带写接口的本地服务默认只绑定 127.0.0.1。';renderPool();if(selected)await selectFinding(selected)}catch(e){toast(e.message)}}load();
</script></body></html>
