<!doctype html>
<html lang="en" data-delivery-type="one-pager">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="generator" content="pdf-author-editor">
  <title>{{TITLE}}</title>
  <style>
    {{CSS}}
    @page {
      size: {{PAGE_SIZE}} {{PAGE_ORIENTATION}};
      margin: {{PAGE_MARGIN}};
    }
    html, body {
      min-height: 100%;
    }
    body {
      background: #edf2f7;
      color: #172033;
      font-family: "Segoe UI", Arial, sans-serif;
      line-height: 1.42;
      margin: 0;
    }
    .one-page {
      background: #ffffff;
      box-sizing: border-box;
      margin: 24px auto;
      max-width: 900px;
      min-height: 1160px;
      overflow: hidden;
      padding: 34px 38px;
    }
    .doc-header {
      border-bottom: 2px solid #1f6feb;
      margin-bottom: 22px;
      padding-bottom: 16px;
    }
    .doc-title {
      font-size: 32px;
      line-height: 1.1;
      margin: 0 0 8px;
    }
    .doc-subtitle {
      color: #526174;
      font-size: 16px;
      margin: 0;
    }
    .doc-meta {
      color: #69778a;
      font-size: 11px;
      margin-top: 10px;
      text-transform: uppercase;
    }
    h1, h2, h3, h4 {
      line-height: 1.18;
      margin: 0.9em 0 0.35em;
    }
    h1 { font-size: 23px; }
    h2 { font-size: 19px; }
    h3 { font-size: 16px; }
    h4 { font-size: 14px; }
    p, li {
      font-size: 13px;
    }
    p {
      margin: 0.45em 0;
    }
    ul, ol {
      margin: 8px 0 10px 20px;
      padding: 0;
    }
    .content-grid {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .content-grid > .wide,
    .content-grid > table,
    .content-grid > figure,
    .content-grid > .divider {
      grid-column: 1 / -1;
    }
    table {
      border-collapse: collapse;
      font-size: 11px;
      margin: 10px 0;
      width: 100%;
    }
    th, td {
      border: 1px solid #d9e1ec;
      padding: 6px 7px;
      text-align: left;
      vertical-align: top;
    }
    th {
      background: #eef4fa;
      font-weight: 650;
    }
    .callout {
      background: #eef7ff;
      border-left: 4px solid #2f80ed;
      border-radius: 5px;
      padding: 9px 10px;
    }
    .callout.warning {
      background: #fff7e8;
      border-left-color: #d9822b;
    }
    .callout.success {
      background: #edf8f2;
      border-left-color: #2f9e62;
    }
    .callout-title {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 3px;
    }
    .divider {
      border: 0;
      border-top: 1px solid #dfe7f0;
      margin: 10px 0;
    }
    img {
      display: block;
      height: auto;
      max-width: 100%;
    }
    @media print {
      body {
        background: #fff;
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
      }
      .one-page {
        margin: 0;
        max-width: none;
        min-height: 0;
        padding: 0;
      }
      .no-print {
        display: none !important;
      }
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="one-page">
    <header class="doc-header">
      <h1 class="doc-title">{{TITLE}}</h1>
      <p class="doc-subtitle">{{SUBTITLE}}</p>
      <div class="doc-meta">{{META}}</div>
    </header>
    <section class="content-grid">
      {{CONTENT}}
    </section>
  </main>
  <script>window.__RENDER_READY__ = true;</script>
</body>
</html>
