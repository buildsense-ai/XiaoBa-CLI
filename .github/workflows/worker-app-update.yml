name: Update Worker Application Artifacts

# Part A: on a stable tag (with the kill-switch repo var enabled) or a manual
# dispatch from main, build the deterministic worker application artifact and
# deploy it serially to the worker targets. Only /opt/catsco is touched on the
# workers; /srv/catsco-agent data is never modified.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      update_workers:
        description: Deploy the current main build to worker targets
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: worker-app-update
  cancel-in-progress: false

env:
  NODE_VERSION: "22.23.1"

jobs:
  build-and-deploy:
    name: Build artifact and deploy to workers
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.update_workers &&
       github.ref == 'refs/heads/main') ||
      (startsWith(github.ref, 'refs/tags/') &&
       vars.CTYUN_WORKER_APP_UPDATE == 'true')
    runs-on: ubuntu-24.04
    environment: release-prod
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Build deterministic worker artifact
        run: |
          mkdir -p release/worker
          node scripts/build-linux-worker-artifact.mjs > release/worker/build-manifest.json
      # P2 guard: only strict vX.Y.Z release tags may reach production workers
      # (e.g. v1.0.8-fork-volc-dual-bucket-fix-... must never deploy).
      - name: Validate release tag is strict SemVer
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "refusing non-SemVer release tag: $GITHUB_REF_NAME" >&2
            exit 1
          }
      - name: Deploy artifact to worker targets
        run: |
          # P2: fail-closed — 未配置目标列表时拒绝回退到本地 alias 默认矩阵
          [[ -n "$WORKER_SSH_TARGETS" ]] || {
            echo "WORKER_SSH_TARGETS is empty; refusing to fall back to local aliases" >&2
            exit 1
          }
          # 安全写入临时私钥与 known_hosts（来自 repo secrets/vars，仅按名引用）
          KEY_FILE="$RUNNER_TEMP/worker_ssh_key"
          KNOWN_HOSTS="$RUNNER_TEMP/worker_known_hosts"
          printf '%s\n' "$WORKER_SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          printf '%s\n' "$WORKER_SSH_KNOWN_HOSTS" > "$KNOWN_HOSTS"
          chmod 600 "$KNOWN_HOSTS"
          ARTIFACT="$(jq -r .artifactPath release/worker/build-manifest.json)"
          SHA="$(jq -r .sha256 release/worker/build-manifest.json)"
          VERSION="$(jq -r .version release/worker/build-manifest.json)"
          COMMIT="$(jq -r .commit release/worker/build-manifest.json)"
          node scripts/deploy-worker-artifact.mjs \
            --artifact "$ARTIFACT" --sha256 "$SHA" \
            --version "$VERSION" --commit "$COMMIT" \
            --ssh-key "$KEY_FILE" \
            --ssh-user "${WORKER_SSH_USER:-root}" \
            --known-hosts "$KNOWN_HOSTS" \
            --targets "$WORKER_SSH_TARGETS"
        env:
          # Secret values are referenced by name only — never hardcoded.
          WORKER_SSH_KEY: ${{ secrets.WORKER_SSH_KEY }}
          WORKER_SSH_KNOWN_HOSTS: ${{ secrets.WORKER_SSH_KNOWN_HOSTS }}
          # Target hosts / user come from repo vars so CI resolves real hosts
          # (not local ssh aliases).
          WORKER_SSH_TARGETS: ${{ vars.WORKER_SSH_TARGETS }}
          WORKER_SSH_USER: ${{ vars.WORKER_SSH_USER }}
